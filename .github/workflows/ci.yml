name: CI

on:
  push:
    branches: [main, dev, theme/poster]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/vernika_ci_test
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
      CRON_SECRET: ci-test-cron-secret-super-secure

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Seed Database for CI Tests
        run: npx tsx scripts/seed_catalog.ts
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/vernika_ci_test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Design System Lint
        run: npm run design:lint

      - name: Build Production Bundle
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/vernika_ci_test
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
